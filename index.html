<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dual Numbers — Interactive</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root {
      --bg: #fafaf7;  --surface: #ffffff;
      --ink: #1a1a1a; --ink-soft: #4a4a4a;
      --border: #e8e6e0;
      --accent: #6b4eff; --accent-soft: #ede9ff;
      --curve: #1a1a1a; --tangent: #6b4eff; --ghost: #b8b3a8;
      --radius: 4px; --pad: 24px; --gap: 16px;
      --font-body: 'Noto Serif JP', 'Source Serif Pro', Georgia, serif;
      --font-ui: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      --font-mono: 'JetBrains Mono', Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.6; }
    header.app-header { border-bottom: 1px solid var(--border); padding: 16px 24px; font-family: var(--font-ui); font-weight: 600; }
    .layout { display: grid; grid-template-columns: 240px 1fr; max-width: 1200px; margin: 0 auto; gap: var(--gap); padding: var(--gap); }
    aside.sidebar { font-family: var(--font-ui); font-size: 14px; }
    aside.sidebar a { display: block; padding: 8px 12px; color: var(--ink-soft); text-decoration: none; border-radius: var(--radius); }
    aside.sidebar a.active { background: var(--accent-soft); color: var(--accent); }
    aside.sidebar a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    main.main { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--pad); min-height: 480px; }
    .panel { display: grid; grid-template-columns: 1fr 600px; gap: var(--gap); }
    @media (max-width: 1100px) { .layout, .panel { grid-template-columns: 1fr; } }
    .ghost { color: var(--ghost); }
    canvas { background: var(--surface); border: 1px solid var(--border); }
    input[type="range"] { width: 100%; }
    button { font-family: var(--font-ui); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    pre.code { font-family: var(--font-mono); background: #f5f3ee; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; font-size: 13px; overflow-x: auto; }
    .test-row { padding: 4px 0; font-family: var(--font-mono); font-size: 13px; }
    .test-row.pass { color: #2a7a2a; }
    .test-row.fail { color: #b00020; font-weight: 600; }
    .step-row { padding: 4px 0; }
    .step-row.highlight { background: var(--accent-soft); padding: 4px 8px; border-radius: var(--radius); }
    .warn { color: #b00020; }
  </style>
</head>
<body>
  <header class="app-header">Dual Numbers — Interactive</header>
  <div class="layout">
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="例題メニュー"></aside>
    <main class="main" id="main" role="main" aria-live="polite"></main>
  </div>
  <script>
    'use strict';
    // === Dual class ===
    class Dual {
      constructor(re, du = 0) { this.re = re; this.du = du; }
      static c(x) { return new Dual(x, 0); }
      static v(x) { return new Dual(x, 1); }
      add(b) { return new Dual(this.re + b.re, this.du + b.du); }
      sub(b) { return new Dual(this.re - b.re, this.du - b.du); }
      mul(b) { return new Dual(this.re * b.re, this.re * b.du + this.du * b.re); }
      div(b) {
        const r = b.re;
        return new Dual(this.re / r, (this.du * r - this.re * b.du) / (r * r));
      }
      neg() { return new Dual(-this.re, -this.du); }
      sin()  { return new Dual(Math.sin(this.re),  Math.cos(this.re) * this.du); }
      cos()  { return new Dual(Math.cos(this.re), -Math.sin(this.re) * this.du); }
      exp()  { const e = Math.exp(this.re); return new Dual(e, e * this.du); }
      log()  { return new Dual(Math.log(this.re), this.du / this.re); }
      pow(n) {
        const r = Math.pow(this.re, n);
        return new Dual(r, n * Math.pow(this.re, n - 1) * this.du);
      }
    }
    // === Self-test ===
    const __tests = [];
    function test(name, fn) { __tests.push({ name, fn }); }
    function runSelfTest(container) {
      container.replaceChildren(h('h2', {}, 'Self-test'));
      let pass = 0, fail = 0;
      for (const t of __tests) {
        let ok = false, err = null;
        try { ok = !!t.fn(); } catch (e) { err = e; }
        container.appendChild(h('div', { class: 'test-row ' + (ok ? 'pass' : 'fail') },
          (ok ? 'PASS  ' : 'FAIL  ') + t.name + (err ? '  — ' + err.message : '')));
        ok ? pass++ : fail++;
      }
      container.appendChild(h('div', { class: 'test-row ' + (fail === 0 ? 'pass' : 'fail') },
        `${pass} passed, ${fail} failed`));
    }
    const eq = (a, b, eps = 1e-9) => Math.abs(a - b) < eps;

    test('runner sanity', () => 1 + 1 === 2);
    test('Dual.c is constant (du = 0)', () => {
      const a = Dual.c(5);
      return eq(a.re, 5) && eq(a.du, 0);
    });
    test('Dual.v is variable (du = 1)', () => {
      const a = Dual.v(3);
      return eq(a.re, 3) && eq(a.du, 1);
    });
    test('add: f(x) = x + 2 at x=3 gives f=5, df=1', () => {
      const r = Dual.v(3).add(Dual.c(2));
      return eq(r.re, 5) && eq(r.du, 1);
    });
    test('sub: f(x) = x - 4 at x=10 gives f=6, df=1', () => {
      const r = Dual.v(10).sub(Dual.c(4));
      return eq(r.re, 6) && eq(r.du, 1);
    });
    test('mul: f(x) = x*x at x=3 gives f=9, df=6', () => {
      const x = Dual.v(3);
      const r = x.mul(x);
      return eq(r.re, 9) && eq(r.du, 6);
    });
    test('div: f(x) = x/2 at x=8 gives f=4, df=0.5', () => {
      const r = Dual.v(8).div(Dual.c(2));
      return eq(r.re, 4) && eq(r.du, 0.5);
    });
    test("div quotient rule: f(x)=1/x at x=2 gives df=-0.25", () => {
      const r = Dual.c(1).div(Dual.v(2));
      return eq(r.re, 0.5) && eq(r.du, -0.25);
    });
    test('neg: f(x) = -x at x=3 gives f=-3, df=-1', () => {
      const r = Dual.v(3).neg();
      return eq(r.re, -3) && eq(r.du, -1);
    });
    test('sin: d/dx sin(x) at x=0 is cos(0)=1', () => {
      const r = Dual.v(0).sin();
      return eq(r.re, 0) && eq(r.du, 1);
    });
    test('cos: d/dx cos(x) at x=π/2 is -1', () => {
      const r = Dual.v(Math.PI / 2).cos();
      return eq(r.re, 0) && eq(r.du, -1);
    });
    test('exp: d/dx e^x at x=1 is e', () => {
      const r = Dual.v(1).exp();
      return eq(r.re, Math.E) && eq(r.du, Math.E);
    });
    test('log: d/dx ln(x) at x=2 is 1/2', () => {
      const r = Dual.v(2).log();
      return eq(r.re, Math.log(2)) && eq(r.du, 0.5);
    });
    test('pow: d/dx x^3 at x=2 is 12', () => {
      const r = Dual.v(2).pow(3);
      return eq(r.re, 8) && eq(r.du, 12);
    });
    test('chain via composition: d/dx sin(x^2) at x=2 = 4 cos(4)', () => {
      const r = Dual.v(2).pow(2).sin();
      return eq(r.re, Math.sin(4)) && eq(r.du, 4 * Math.cos(4));
    });
    // === UI helpers ===
    function h(tag, attrs = {}, ...children) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v);
      }
      for (const c of children.flat()) {
        if (c == null || c === false) continue;
        el.appendChild(typeof c === 'string' || typeof c === 'number'
          ? document.createTextNode(String(c)) : c);
      }
      return el;
    }
    function typeset(container) {
      if (!window.MathJax || !MathJax.typesetPromise) return;
      if (MathJax.typesetClear) MathJax.typesetClear([container]);
      MathJax.typesetPromise([container]);
    }
    // === Examples ===
    const examples = {};

    examples.intro = {
      title: '導入：二重数とは',
      hash: '#/intro',
      initialState() { return {}; },
      render(container) {
        container.replaceChildren(
          h('h2', {}, '二重数とは何か'),
          h('p', {}, '二重数は実数の組 ', h('strong', {}, '$a + b\\varepsilon$'),
            ' で、記号 $\\varepsilon$ は ', h('strong', {}, '$\\varepsilon^2 = 0$'),
            ' を満たします（しかし $\\varepsilon \\ne 0$）。複素数の $i^2 = -1$ と並列で考えてみましょう。'),

          h('h3', {}, 'なぜ自動微分になるのか'),
          h('p', {}, '関数 $f$ を $x + \\varepsilon$ で評価し Taylor 展開すると：'),
          h('p', {}, '$f(x + \\varepsilon) = f(x) + f\'(x)\\varepsilon + \\tfrac{1}{2}f\'\'(x)\\varepsilon^2 + \\cdots = f(x) + f\'(x)\\varepsilon$'),
          h('p', {}, '$\\varepsilon^2 = 0$ により高次項がすべて消え、',
            h('strong', {}, '実部に $f(x)$、$\\varepsilon$ 部に $f\'(x)$ が自動的に出る'), 'のです。'),

          h('h3', {}, '数式とコードの対応（一例）'),
          h('p', {}, '乗算規則 $(a + b\\varepsilon)(c + d\\varepsilon) = ac + (ad + bc)\\varepsilon$ は、そのまま JavaScript で：'),
          h('pre', { class: 'code' },
            'mul(b) {\n' +
            '  return new Dual(\n' +
            '    this.re * b.re,                       // 実部 = ac\n' +
            '    this.re * b.du + this.du * b.re       // ε部 = ad + bc\n' +
            '  );\n' +
            '}'),
          h('p', {}, '左メニューから例題を選んで、二重数が「微分計算機」として動く様子を見てください。'),
        );
        typeset(container);
      },
    };
    // === Router ===
    const routes = [
      { hash: '#/intro', label: '導入',     get: () => examples.intro },
      { hash: '#/poly',  label: '多項式',   get: () => examples.poly },
      { hash: '#/trig',  label: '三角関数', get: () => examples.trig },
      { hash: '#/chain', label: '連鎖律',   get: () => examples.chain },
      { hash: '#/newton',label: 'Newton 法',get: () => examples.newton },
      { hash: '#/grad-descent', label: '勾配降下', get: () => examples.gradDescent },
    ];
    function buildSidebar() {
      const aside = document.getElementById('sidebar');
      aside.replaceChildren(...routes.map(r =>
        h('a', { href: r.hash, 'data-hash': r.hash }, r.label)));
    }
    function highlightSidebar(hash) {
      document.querySelectorAll('#sidebar a').forEach(a => {
        const active = a.dataset.hash === hash;
        a.classList.toggle('active', active);
        if (active) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });
    }
    function router() {
      const main = document.getElementById('main');
      if (location.hash === '#test') { runSelfTest(main); return; }
      if (!location.hash) { location.hash = '#/intro'; return; }
      highlightSidebar(location.hash);
      const route = routes.find(r => r.hash === location.hash);
      const ex = route && route.get();
      if (!ex) { main.replaceChildren(document.createTextNode('(未実装: ' + location.hash + ')')); return; }
      ex.render(main, ex.initialState());
    }
    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', () => { buildSidebar(); router(); });
  </script>
</body>
</html>
