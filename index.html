<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dual Numbers — Interactive</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root {
      --bg: #fafaf7;  --surface: #ffffff;
      --ink: #1a1a1a; --ink-soft: #4a4a4a;
      --border: #e8e6e0;
      --accent: #6b4eff; --accent-soft: #ede9ff;
      --curve: #1a1a1a; --tangent: #6b4eff; --ghost: #b8b3a8;
      --radius: 4px; --pad: 24px; --gap: 16px;
      --font-body: 'Noto Serif JP', 'Source Serif Pro', Georgia, serif;
      --font-ui: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      --font-mono: 'JetBrains Mono', Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.6; }
    header.app-header { border-bottom: 1px solid var(--border); padding: 16px 24px; font-family: var(--font-ui); font-weight: 600; }
    .layout { display: grid; grid-template-columns: 240px 1fr; max-width: 1200px; margin: 0 auto; gap: var(--gap); padding: var(--gap); }
    aside.sidebar { font-family: var(--font-ui); font-size: 14px; }
    aside.sidebar a { display: block; padding: 8px 12px; color: var(--ink-soft); text-decoration: none; border-radius: var(--radius); }
    aside.sidebar a.active { background: var(--accent-soft); color: var(--accent); }
    aside.sidebar a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    main.main { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--pad); min-height: 480px; }
    .panel { display: grid; grid-template-columns: 1fr 600px; gap: var(--gap); }
    @media (max-width: 1100px) { .layout, .panel { grid-template-columns: 1fr; } }
    .ghost { color: var(--ghost); }
    canvas { background: var(--surface); border: 1px solid var(--border); }
    input[type="range"] { width: 100%; }
    button { font-family: var(--font-ui); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    pre.code { font-family: var(--font-mono); background: #f5f3ee; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; font-size: 13px; overflow-x: auto; }
    .test-row { padding: 4px 0; font-family: var(--font-mono); font-size: 13px; }
    .test-row.pass { color: #2a7a2a; }
    .test-row.fail { color: #b00020; font-weight: 600; }
    .step-row { padding: 4px 0; }
    .step-row.highlight { background: var(--accent-soft); padding: 4px 8px; border-radius: var(--radius); }
    .warn { color: #b00020; }
  </style>
</head>
<body>
  <header class="app-header">Dual Numbers — Interactive</header>
  <div class="layout">
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="例題メニュー"></aside>
    <main class="main" id="main" role="main" aria-live="polite"></main>
  </div>
  <script>
    'use strict';
    // === Dual class ===
    class Dual {
      constructor(re, du = 0) { this.re = re; this.du = du; }
      static c(x) { return new Dual(x, 0); }
      static v(x) { return new Dual(x, 1); }
      add(b) { return new Dual(this.re + b.re, this.du + b.du); }
      sub(b) { return new Dual(this.re - b.re, this.du - b.du); }
      mul(b) { return new Dual(this.re * b.re, this.re * b.du + this.du * b.re); }
      div(b) {
        const r = b.re;
        return new Dual(this.re / r, (this.du * r - this.re * b.du) / (r * r));
      }
      neg() { return new Dual(-this.re, -this.du); }
      sin()  { return new Dual(Math.sin(this.re),  Math.cos(this.re) * this.du); }
      cos()  { return new Dual(Math.cos(this.re), -Math.sin(this.re) * this.du); }
      exp()  { const e = Math.exp(this.re); return new Dual(e, e * this.du); }
      log()  { return new Dual(Math.log(this.re), this.du / this.re); }
      pow(n) {
        const r = Math.pow(this.re, n);
        if (this.re === 0 && n < 1) {
          return new Dual(r, this.du === 0 ? 0 : NaN);
        }
        return new Dual(r, n * Math.pow(this.re, n - 1) * this.du);
      }
    }
    // === Self-test ===
    const __tests = [];
    function test(name, fn) { __tests.push({ name, fn }); }
    function runSelfTest(container) {
      container.replaceChildren(h('h2', {}, 'Self-test'));
      let pass = 0, fail = 0;
      for (const t of __tests) {
        let ok = false, err = null;
        try { ok = !!t.fn(); } catch (e) { err = e; }
        container.appendChild(h('div', { class: 'test-row ' + (ok ? 'pass' : 'fail') },
          (ok ? 'PASS  ' : 'FAIL  ') + t.name + (err ? '  — ' + err.message : '')));
        ok ? pass++ : fail++;
      }
      container.appendChild(h('div', { class: 'test-row ' + (fail === 0 ? 'pass' : 'fail') },
        `${pass} passed, ${fail} failed`));
    }
    const eq = (a, b, eps = 1e-9) => Math.abs(a - b) < eps;

    test('runner sanity', () => 1 + 1 === 2);
    test('Dual.c is constant (du = 0)', () => {
      const a = Dual.c(5);
      return eq(a.re, 5) && eq(a.du, 0);
    });
    test('Dual.v is variable (du = 1)', () => {
      const a = Dual.v(3);
      return eq(a.re, 3) && eq(a.du, 1);
    });
    test('add: f(x) = x + 2 at x=3 gives f=5, df=1', () => {
      const r = Dual.v(3).add(Dual.c(2));
      return eq(r.re, 5) && eq(r.du, 1);
    });
    test('sub: f(x) = x - 4 at x=10 gives f=6, df=1', () => {
      const r = Dual.v(10).sub(Dual.c(4));
      return eq(r.re, 6) && eq(r.du, 1);
    });
    test('mul: f(x) = x*x at x=3 gives f=9, df=6', () => {
      const x = Dual.v(3);
      const r = x.mul(x);
      return eq(r.re, 9) && eq(r.du, 6);
    });
    test('div: f(x) = x/2 at x=8 gives f=4, df=0.5', () => {
      const r = Dual.v(8).div(Dual.c(2));
      return eq(r.re, 4) && eq(r.du, 0.5);
    });
    test("div quotient rule: f(x)=1/x at x=2 gives df=-0.25", () => {
      const r = Dual.c(1).div(Dual.v(2));
      return eq(r.re, 0.5) && eq(r.du, -0.25);
    });
    test('neg: f(x) = -x at x=3 gives f=-3, df=-1', () => {
      const r = Dual.v(3).neg();
      return eq(r.re, -3) && eq(r.du, -1);
    });
    test('sin: d/dx sin(x) at x=0 is cos(0)=1', () => {
      const r = Dual.v(0).sin();
      return eq(r.re, 0) && eq(r.du, 1);
    });
    test('cos: d/dx cos(x) at x=π/2 is -1', () => {
      const r = Dual.v(Math.PI / 2).cos();
      return eq(r.re, 0) && eq(r.du, -1);
    });
    test('exp: d/dx e^x at x=1 is e', () => {
      const r = Dual.v(1).exp();
      return eq(r.re, Math.E) && eq(r.du, Math.E);
    });
    test('log: d/dx ln(x) at x=2 is 1/2', () => {
      const r = Dual.v(2).log();
      return eq(r.re, Math.log(2)) && eq(r.du, 0.5);
    });
    test('pow: d/dx x^3 at x=2 is 12', () => {
      const r = Dual.v(2).pow(3);
      return eq(r.re, 8) && eq(r.du, 12);
    });
    test('chain via composition: d/dx sin(x^2) at x=2 = 4 cos(4)', () => {
      const r = Dual.v(2).pow(2).sin();
      return eq(r.re, Math.sin(4)) && eq(r.du, 4 * Math.cos(4));
    });
    test('plotMap: maps domain mid to canvas mid x', () => {
      const m = makePlotMap({ xMin: -1, xMax: 1, yMin: -1, yMax: 1, w: 600, h: 360 });
      return eq(m.toX(0), 300) && eq(m.toY(0), 180);
    });
    test('plotMap: yMax → canvas top', () => {
      const m = makePlotMap({ xMin: 0, xMax: 1, yMin: 0, yMax: 1, w: 100, h: 100 });
      return eq(m.toY(1), 0);
    });
    test('poly compute: f(2) = 1, f\'(2) = 5', () => {
      const r = examples.poly.compute({ x: 2 });
      return eq(r.value, 1) && eq(r.derivative, 5);
    });
    test('poly compute: f(0) = -1, f\'(0) = 1', () => {
      const r = examples.poly.compute({ x: 0 });
      return eq(r.value, -1) && eq(r.derivative, 1);
    });
    test('trig compute sin: f(0)=0, f\'(0)=1', () => {
      const r = examples.trig.compute({ x: 0, fn: 'sin', terms: 1 });
      return eq(r.value, 0) && eq(r.derivative, 1);
    });
    test('trig compute exp: f(1)=e, f\'(1)=e', () => {
      const r = examples.trig.compute({ x: 1, fn: 'exp', terms: 1 });
      return eq(r.value, Math.E) && eq(r.derivative, Math.E);
    });
    // === UI helpers ===
    function h(tag, attrs = {}, ...children) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else el.setAttribute(k, v);
      }
      for (const c of children.flat()) {
        if (c == null || c === false) continue;
        el.appendChild(typeof c === 'string' || typeof c === 'number'
          ? document.createTextNode(String(c)) : c);
      }
      return el;
    }
    function typeset(container) {
      if (!window.MathJax || !MathJax.typesetPromise) return;
      if (MathJax.typesetClear) MathJax.typesetClear([container]);
      MathJax.typesetPromise([container]).catch(err => console.error('[MathJax]', err));
    }
    function makePlotMap({ xMin, xMax, yMin, yMax, w, h }) {
      return {
        toX: x => ((x - xMin) / (xMax - xMin)) * w,
        toY: y => h - ((y - yMin) / (yMax - yMin)) * h,
        xMin, xMax, yMin, yMax, w, h,
      };
    }
    function setupCanvas(canvas, w, h) {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return ctx;
    }
    function drawAxes(ctx, m) {
      ctx.save();
      ctx.strokeStyle = '#e8e6e0';
      ctx.lineWidth = 1;
      if (m.yMin <= 0 && m.yMax >= 0) {
        ctx.beginPath(); ctx.moveTo(0, m.toY(0)); ctx.lineTo(m.w, m.toY(0)); ctx.stroke();
      }
      if (m.xMin <= 0 && m.xMax >= 0) {
        ctx.beginPath(); ctx.moveTo(m.toX(0), 0); ctx.lineTo(m.toX(0), m.h); ctx.stroke();
      }
      ctx.restore();
    }
    function drawCurve(ctx, m, fn, opts = {}) {
      ctx.save();
      ctx.strokeStyle = opts.color || '#1a1a1a';
      ctx.lineWidth = opts.width || 2;
      ctx.beginPath();
      let started = false;
      const N = 600;
      for (let i = 0; i <= N; i++) {
        const x = m.xMin + (m.xMax - m.xMin) * (i / N);
        const y = fn(x);
        if (!Number.isFinite(y)) { started = false; continue; }
        const px = m.toX(x), py = m.toY(y);
        if (!started) { ctx.moveTo(px, py); started = true; }
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.restore();
    }
    function drawPoint(ctx, m, x, y, color = '#6b4eff') {
      ctx.save(); ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(m.toX(x), m.toY(y), 4, 0, 2 * Math.PI); ctx.fill();
      ctx.restore();
    }
    function drawTangent(ctx, m, x0, y0, slope, color = '#6b4eff') {
      ctx.save();
      ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
      ctx.beginPath();
      const x1 = m.xMin, x2 = m.xMax;
      ctx.moveTo(m.toX(x1), m.toY(y0 + slope * (x1 - x0)));
      ctx.lineTo(m.toX(x2), m.toY(y0 + slope * (x2 - x0)));
      ctx.stroke();
      ctx.restore();
    }
    let __sliderSeq = 0;
    function makeSlider({ min, max, step, value, label, format = v => Number(v).toFixed(2) }) {
      const id = 'slider-' + (++__sliderSeq);
      const valueEl = h('span', {}, format(value));
      const slider = h('input', {
        type: 'range', id,
        min: String(min), max: String(max), step: String(step), value: String(value),
      });
      const container = h('div', { style: { marginTop: '16px' } },
        h('label', { for: id }, label, ' = ', valueEl),
        slider);
      return { container, slider, valueEl };
    }
    function renderSteps(container, steps) {
      container.replaceChildren(...steps.map(s => {
        const cls = 'step-row' + (s.highlight ? ' highlight' : '') + (s.ghost ? ' ghost' : '');
        return h('div', { class: cls }, '$$' + s.latex + '$$');
      }));
      typeset(container);
    }
    // === Examples ===
    const examples = {};

    examples.intro = {
      title: '導入：二重数とは',
      hash: '#/intro',
      initialState() { return {}; },
      render(container) {
        container.replaceChildren(
          h('h2', {}, '二重数とは何か'),
          h('p', {}, '二重数は実数の組 ', h('strong', {}, '$a + b\\varepsilon$'),
            ' で、記号 $\\varepsilon$ は ', h('strong', {}, '$\\varepsilon^2 = 0$'),
            ' を満たします（しかし $\\varepsilon \\ne 0$）。複素数の $i^2 = -1$ と並列で考えてみましょう。'),

          h('h3', {}, 'なぜ自動微分になるのか'),
          h('p', {}, '関数 $f$ を $x + \\varepsilon$ で評価し Taylor 展開すると：'),
          h('p', {}, '$f(x + \\varepsilon) = f(x) + f\'(x)\\varepsilon + \\tfrac{1}{2}f\'\'(x)\\varepsilon^2 + \\cdots = f(x) + f\'(x)\\varepsilon$'),
          h('p', {}, '$\\varepsilon^2 = 0$ により高次項がすべて消え、',
            h('strong', {}, '実部に $f(x)$、$\\varepsilon$ 部に $f\'(x)$ が自動的に出る'), 'のです。'),

          h('h3', {}, '数式とコードの対応（一例）'),
          h('p', {}, '乗算規則 $(a + b\\varepsilon)(c + d\\varepsilon) = ac + (ad + bc)\\varepsilon$ は、そのまま JavaScript で：'),
          h('pre', { class: 'code' },
            'mul(b) {\n' +
            '  return new Dual(\n' +
            '    this.re * b.re,                       // 実部 = ac\n' +
            '    this.re * b.du + this.du * b.re       // ε部 = ad + bc\n' +
            '  );\n' +
            '}'),
          h('p', {}, '左メニューから例題を選んで、二重数が「微分計算機」として動く様子を見てください。'),
        );
        typeset(container);
      },
    };

    examples.poly = {
      title: '多項式の自動微分',
      hash: '#/poly',
      initialState() { return { x: 1.0 }; },
      fn(x) { return x*x*x - 2*x*x + x - 1; },
      compute(state) {
        const x = Dual.v(state.x);
        const f = x.pow(3).sub(Dual.c(2).mul(x.pow(2))).add(x).sub(Dual.c(1));
        const a = state.x;
        const steps = [
          { latex: 'f(x) = x^3 - 2x^2 + x - 1' },
          { latex: `f(${a}+\\varepsilon) = (${a}+\\varepsilon)^3 - 2(${a}+\\varepsilon)^2 + (${a}+\\varepsilon) - 1` },
          { latex: `\\quad = (${(a**3).toFixed(2)} + ${(3*a*a).toFixed(2)}\\varepsilon \\,{\\color{#b8b3a8}+\\, 3\\cdot${a}\\,\\varepsilon^2 + \\varepsilon^3})`
                  + ` - 2(${(a*a).toFixed(2)} + ${(2*a).toFixed(2)}\\varepsilon \\,{\\color{#b8b3a8}+\\,\\varepsilon^2})`
                  + ` + ${a} + \\varepsilon - 1` },
          { latex: `\\quad = ${(f.re).toFixed(4)} + (${(f.du).toFixed(4)})\\,\\varepsilon \\quad (\\because \\varepsilon^2 = 0)`, highlight: true },
          { latex: `\\therefore f(${a}) = ${f.re.toFixed(4)}, \\quad f'(${a}) = ${f.du.toFixed(4)}` },
        ];
        return { value: f.re, derivative: f.du, steps };
      },
      render(container, state) {
        const stepsEl = h('div', {});
        const x = makeSlider({ min: -3, max: 3, step: 0.01, value: state.x, label: '$x$' });
        const canvas = h('canvas', {});
        container.replaceChildren(
          h('h2', {}, examples.poly.title),
          h('div', { class: 'panel' },
            h('div', {},
              h('p', {}, '$f(x) = x^3 - 2x^2 + x - 1$ を二重数で評価すると、実部に $f(x)$、$\\varepsilon$ 部に $f\'(x)$ が同時に出ます。'),
              stepsEl,
              x.container,
            ),
            h('div', {}, canvas)),
        );
        const ctx = setupCanvas(canvas, 600, 360);
        const m = makePlotMap({ xMin: -3, xMax: 3, yMin: -10, yMax: 10, w: 600, h: 360 });
        const update = () => {
          const r = examples.poly.compute(state);
          renderSteps(stepsEl, r.steps);
          ctx.clearRect(0, 0, m.w, m.h);
          drawAxes(ctx, m);
          drawCurve(ctx, m, examples.poly.fn);
          drawTangent(ctx, m, state.x, r.value, r.derivative);
          drawPoint(ctx, m, state.x, r.value);
        };
        x.slider.addEventListener('input', e => {
          state.x = parseFloat(e.target.value);
          x.valueEl.textContent = state.x.toFixed(2);
          update();
        });
        update();
      },
    };

    examples.trig = {
      title: 'sin / cos / exp と Taylor 展開',
      hash: '#/trig',
      initialState() { return { x: 1.0, fn: 'sin', terms: 1 }; },
      funcs: {
        sin: { f: x => Math.sin(x), d: (x, i) => Math.sin(x + i*Math.PI/2), latex: '\\sin(x)' },
        cos: { f: x => Math.cos(x), d: (x, i) => Math.cos(x + i*Math.PI/2), latex: '\\cos(x)' },
        exp: { f: x => Math.exp(x), d: (x, _i) => Math.exp(x),              latex: 'e^x' },
      },
      compute(state) {
        const x = Dual.v(state.x);
        const r = state.fn === 'sin' ? x.sin() : state.fn === 'cos' ? x.cos() : x.exp();
        const a = state.x;
        const lineExpand = state.fn === 'exp'
          ? `e^{${a}+\\varepsilon} = e^{${a}} \\cdot e^{\\varepsilon} = e^{${a}}(1 + \\varepsilon \\,{\\color{#b8b3a8}+\\, \\tfrac{\\varepsilon^2}{2}+\\cdots})`
          : state.fn === 'sin'
          ? `\\sin(${a}+\\varepsilon) = \\sin(${a})\\cos(\\varepsilon) + \\cos(${a})\\sin(\\varepsilon) \\;\\;(\\cos\\varepsilon\\to 1,\\;\\sin\\varepsilon\\to\\varepsilon)`
          : `\\cos(${a}+\\varepsilon) = \\cos(${a})\\cos(\\varepsilon) - \\sin(${a})\\sin(\\varepsilon) \\;\\;(\\cos\\varepsilon\\to 1,\\;\\sin\\varepsilon\\to\\varepsilon)`;
        const steps = [
          { latex: `f(x) = ${examples.trig.funcs[state.fn].latex}` },
          { latex: lineExpand },
          { latex: `\\quad = ${r.re.toFixed(4)} + (${r.du.toFixed(4)})\\,\\varepsilon`, highlight: true },
          { latex: `\\therefore f(${a}) = ${r.re.toFixed(4)}, \\quad f'(${a}) = ${r.du.toFixed(4)}` },
        ];
        return { value: r.re, derivative: r.du, steps };
      },
      taylorSum(fn, a, terms) {
        return x => {
          let sum = 0, fact = 1;
          for (let k = 0; k < terms; k++) {
            if (k > 0) fact *= k;
            sum += fn.d(a, k) * Math.pow(x - a, k) / fact;
          }
          return sum;
        };
      },
      render(container, state) {
        const selectId = 'trig-fn-' + (++__sliderSeq);
        const select = h('select', { id: selectId },
          h('option', { value: 'sin' }, 'sin x'),
          h('option', { value: 'cos' }, 'cos x'),
          h('option', { value: 'exp' }, 'e^x'));
        select.value = state.fn;
        const stepsEl = h('div', {});
        const x = makeSlider({ min: -3, max: 3, step: 0.01, value: state.x, label: '$x$' });
        const termsVal = h('span', {}, String(state.terms));
        const addBtn = h('button', {}, '+ 項を追加');
        const resetBtn = h('button', {}, 'リセット');
        const canvas = h('canvas', {});
        container.replaceChildren(
          h('h2', {}, examples.trig.title),
          h('div', { class: 'panel' },
            h('div', {},
              h('div', { style: { marginBottom: '12px' } }, h('label', { for: selectId }, '関数: '), select),
              stepsEl,
              x.container,
              h('div', { style: { marginTop: '12px' } },
                h('label', {}, 'Taylor 次数: ', termsVal), ' ', addBtn, ' ', resetBtn)),
            h('div', {}, canvas)),
        );
        const ctx = setupCanvas(canvas, 600, 360);
        const update = () => {
          const fnDef = examples.trig.funcs[state.fn];
          const yRange = state.fn === 'exp' ? [-1, 20] : [-2, 2];
          const m = makePlotMap({ xMin: -3, xMax: 3, yMin: yRange[0], yMax: yRange[1], w: 600, h: 360 });
          const r = examples.trig.compute(state);
          renderSteps(stepsEl, r.steps);
          termsVal.textContent = String(state.terms);
          ctx.clearRect(0, 0, m.w, m.h);
          drawAxes(ctx, m);
          drawCurve(ctx, m, fnDef.f);
          drawCurve(ctx, m, examples.trig.taylorSum(fnDef, state.x, state.terms), { color: '#6b4eff', width: 1.5 });
          drawPoint(ctx, m, state.x, fnDef.f(state.x));
        };
        select.addEventListener('change', e => { state.fn = e.target.value; state.terms = 1; update(); });
        x.slider.addEventListener('input', e => {
          state.x = parseFloat(e.target.value); x.valueEl.textContent = state.x.toFixed(2); update();
        });
        addBtn.addEventListener('click', () => {
          if (state.terms < 8) state.terms += 1;
          update();
        });
        resetBtn.addEventListener('click', () => { state.terms = 1; update(); });
        update();
      },
    };
    // === Router ===
    const routes = [
      { hash: '#/intro', label: '導入',     get: () => examples.intro },
      { hash: '#/poly',  label: '多項式',   get: () => examples.poly },
      { hash: '#/trig',  label: '三角関数', get: () => examples.trig },
      { hash: '#/chain', label: '連鎖律',   get: () => examples.chain },
      { hash: '#/newton',label: 'Newton 法',get: () => examples.newton },
      { hash: '#/grad-descent', label: '勾配降下', get: () => examples.gradDescent },
    ];
    function buildSidebar() {
      const aside = document.getElementById('sidebar');
      aside.replaceChildren(...routes.map(r =>
        h('a', { href: r.hash, 'data-hash': r.hash }, r.label)));
    }
    function highlightSidebar(hash) {
      document.querySelectorAll('#sidebar a').forEach(a => {
        const active = a.dataset.hash === hash;
        a.classList.toggle('active', active);
        if (active) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });
    }
    function router() {
      const main = document.getElementById('main');
      if (location.hash === '#test') { runSelfTest(main); return; }
      if (!location.hash) { location.hash = '#/intro'; return; }
      highlightSidebar(location.hash);
      const route = routes.find(r => r.hash === location.hash);
      const ex = route && route.get();
      if (!ex) { main.replaceChildren(document.createTextNode('(未実装: ' + location.hash + ')')); return; }
      ex.render(main, ex.initialState());
    }
    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', () => { buildSidebar(); router(); });
  </script>
</body>
</html>
